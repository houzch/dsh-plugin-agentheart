# AgentHeart DSH 插件发布（公开仓库）
#
# 产物与去向（**产物生产不依赖任何 npm 凭据**）：
#   1) Actions artifacts —— 每次运行都产出 6 个 tarball（1 主包 + 5 平台子包）；
#   2) GitHub Release —— tag 触发时，把上述 6 个 tarball 作为 Release 资产；
#   3) npm 发布（**可选**）——仅在配置了 `NPM_TOKEN` 时执行；未配置则**跳过而非失败**。
#
# 顺序：**平台子包先于主包** —— 主包 `optionalDependencies` 以**同版本**引用子包，顺序不可颠倒。
#
# 触发：手动（`workflow_dispatch`，填版本号）或打 tag `plugin-v<version>`。
#   注：手动 dispatch **不创建 Release**（无 tag），只产出 artifacts；`NPM_TOKEN` 存在时仍会发 npm。
#
# 前置（一次性，需人工；仅第 3 步需要）：
#   1) 在 npm 创建组织 `agentheart`；
#   2) 配置发布凭据，二选一：
#      A（推荐）Trusted Publishing（OIDC 免令牌）：在**每个**包（主包 + 5 子包）的设置页
#        配置 Trusted Publisher —— Organization or user = houzch、
#        Repository = `dsh-plugin-agentheart`、Workflow filename = `publish-plugin.yml`，
#        并勾选允许 `npm publish`（默认只允许 stage publish）。
#        需 npm CLI ≥ 11.5.1（Node ≥ 22.14）；本工作流已声明 `id-token: write` 并显式升级 npm。
#      B Granular Access Token（GAT）：classic/Automation Token 已于 2025-11 移除。
#        创建 GAT 时 `Packages and scopes` 选 scope `@agentheart` + `Read and write (publish and stage)`，
#        勾选 `Bypass two-factor authentication`，存为仓库 secret `NPM_TOKEN`。
#        （仅给 Organizations 授权**不能**发布该组织的包。）
#   ⚠ npm 已宣布：**bypass-2FA 令牌的直接发布**将于 **2027-01** 停用——届时改用
#     `Read and write (stage only)` + `npm stage publish`（维护者批准），或改用 OIDC。
#
# provenance：本仓库为**公开**仓库 + GitHub Actions OIDC ⇒ `NPM_CONFIG_PROVENANCE=true`
#   （要求 `package.json#repository` 公开且与发布来源一致 —— 已满足）。
#
# GitHub Release 需 `contents: write`，已**限定**在 release job；
#   若组织把 GITHUB_TOKEN 设为只读，该 job 会失败（**不影响** artifacts 与 npm 发布）。
name: Publish plugin

on:
  workflow_dispatch:
    inputs:
      version:
        description: "版本号（须与 package.json 一致，如 1.0.0）"
        required: true
  push:
    tags:
      - "plugin-v*"

# 同一 ref 不并发发布，避免两个 run 同时 `npm publish` 造成版本冲突
concurrency:
  group: publish-plugin-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  # Trusted Publishing（OIDC）/ provenance 所需；与 NPM_TOKEN 回退可并存
  id-token: write

env:
  CARGO_TERM_COLOR: always
  AH_PUBLIC_ROOT: ${{ github.workspace }}/../agentheart
  NPM_CONFIG_PROVENANCE: "true"

jobs:
  # ---------------------------------------------------------------------------
  # 0) 探测是否配置了 NPM_TOKEN：控制「npm 发布」是否执行（无凭据则跳过，不失败）
  # ---------------------------------------------------------------------------
  gate:
    name: 探测发布凭据
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.check.outputs.has_token }}
    steps:
      - id: check
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "has_token=true" >> "$GITHUB_OUTPUT"
            echo "检测到 NPM_TOKEN：将执行 npm 发布"
          else
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 NPM_TOKEN —— 跳过 npm 发布，仅产出 artifacts / GitHub Release"
          fi

  # ---------------------------------------------------------------------------
  # 1) 平台子包：各平台**原生**构建侧车 → 生成子包 → 打 tarball 上传（不碰 npm 凭据）
  #    linux-arm64 使用 arm64 runner；若组织不可用，可改为 `cross` 交叉编译。
  # ---------------------------------------------------------------------------
  platform-packages:
    name: 平台子包（${{ matrix.target }}）
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: win32-x64
          # macOS 13 已于 2025-12-04 退役（用它会永久排队）；Intel 改用 macos-15-intel
          - runner: macos-15-intel
            target: darwin-x64
          # macOS 14 已进入弃用期，arm64 改用 macos-15
          - runner: macos-15
            target: darwin-arm64
          - runner: ubuntu-latest
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
    steps:
      - name: 检出本仓库（插件）
        uses: actions/checkout@v4

      - name: 检出内核仓库到同级目录
        run: git clone --depth 1 "https://github.com/${{ github.repository_owner }}/agentheart.git" ../agentheart

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 构建侧车
        run: cargo build --release --bin agentheartd --manifest-path ../agentheart/Cargo.toml

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: 校验版本一致
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          expected="${{ github.event.inputs.version }}"
          if [ -z "$expected" ]; then expected="${GITHUB_REF_NAME#plugin-v}"; fi
          echo "package.json=$pkg 期望=$expected"
          [ "$pkg" = "$expected" ] || { echo "::error::版本不一致"; exit 1; }

      - name: 生成平台子包
        run: node scripts/build-platform-packages.mjs --target ${{ matrix.target }}

      - name: 打包子包 tarball
        working-directory: platforms/@agentheart/agentheartd-${{ matrix.target }}
        run: npm pack

      - name: 上传子包 tarball
        uses: actions/upload-artifact@v4
        with:
          name: sub-${{ matrix.target }}
          path: platforms/@agentheart/agentheartd-${{ matrix.target }}/*.tgz
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 2) 主包：安装依赖 → 构建 → 打 tarball 上传（不碰 npm 凭据）
  # ---------------------------------------------------------------------------
  main-package:
    name: 主包
    runs-on: ubuntu-latest
    steps:
      - name: 检出本仓库（插件）
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 用 install 而非 ci：lockfile 中平台子包条目尚未发布（optional、无解析结果），
      # `--omit=optional` 跳过即可——主包构建只需 @deepseek-ai/*（dev 依赖）。
      - name: 安装依赖并构建
        run: npm install --omit=optional --no-audit --no-fund

      - name: 校验版本一致
        shell: bash
        run: |
          pkg=$(node -p "require('./package.json').version")
          expected="${{ github.event.inputs.version }}"
          if [ -z "$expected" ]; then expected="${GITHUB_REF_NAME#plugin-v}"; fi
          echo "package.json=$pkg 期望=$expected"
          [ "$pkg" = "$expected" ] || { echo "::error::版本不一致"; exit 1; }

      - name: 打包主包 tarball
        run: npm pack

      - name: 上传主包 tarball
        uses: actions/upload-artifact@v4
        with:
          name: main
          path: "*.tgz"
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3) npm 发布（可选）：仅在存在 NPM_TOKEN 时执行；**先子包、后主包**
  # ---------------------------------------------------------------------------
  publish-npm:
    name: npm 发布（子包 → 主包）
    needs: [gate, platform-packages, main-package]
    if: ${{ needs.gate.outputs.has_token == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: 安装 Node（发布用）
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Trusted Publishing(OIDC) 需 npm CLI ≥ 11.5.1；显式升级，不依赖 Node 自带版本
      - name: 升级 npm CLI（OIDC 要求 ≥ 11.5.1）
        run: npm install -g npm@11

      - name: 下载全部 tarball
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 发布（先 5 个平台子包，再主包）
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          ls -l dist
          for tarball in dist/sub-*/*.tgz; do
            echo "::group::publish ${tarball}"
            npm publish "${tarball}"
            echo "::endgroup::"
          done
          echo "::group::publish main"
          npm publish dist/main/*.tgz
          echo "::endgroup::"

  # ---------------------------------------------------------------------------
  # 4) GitHub Release：汇总 6 个 tarball 作为资产（离线 / 内网 / 免 npm 安装）
  #    仅 tag 触发时创建；**不依赖 npm 发布**（无凭据也能产出）。
  # ---------------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [platform-packages, main-package]
    if: startsWith(github.ref, 'refs/tags/plugin-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部 tarball
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release-assets

      - name: 列出产物
        run: ls -l release-assets

      - name: 创建 Release 并上传资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 本 job 无 checkout，gh 无法从 git remote 推断仓库；必须显式指定
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/*.tgz \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
